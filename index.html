<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Lokma Kalori</title>
<meta name="description" content="Fotoğraftan kalori ve makro takibi. Kayıtlar yalnızca senin cihazında.">
<meta name="theme-color" content="#121110">
<meta name="color-scheme" content="dark">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Lokma">
<meta name="format-detection" content="telephone=no">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preconnect" href="https://generativelanguage.googleapis.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=Onest:wght@400..700&display=swap">
<style>
/* Layout: one thumb-first column. The ring sits off-centre up top, every action lives in the lower third, details rise as sheets from the bottom. */
:root{
  --bg:#121110; --surface:#1B1A17; --raised:#262420; --line:#33302B;
  --fg:#F4EFE7; --muted:#A79F94; --faint:#756E65;
  --kcal:#FF7A3D; --kcal-hot:#FF4A33; --on-kcal:#1D0E06;
  --pro:#8FB3FF; --carb:#E8C36A; --fat:#F38BA2; --fib:#76D4B3; --sug:#C6A8F4;
  --ok:#76D4B3; --warn:#E8C36A; --bad:#FF6A5C;
  --f-display:"Bricolage Grotesque", ui-rounded, "SF Pro Rounded", system-ui, sans-serif;
  --f-body:"Onest", -apple-system, BlinkMacSystemFont, system-ui, "Segoe UI", sans-serif;
  --spring:cubic-bezier(.32,1.28,.48,1);
  --ease:cubic-bezier(.22,1,.36,1);
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
html{background:var(--bg);-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.45;padding-inline:16px;padding-block:0;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
body.has-sheet{overflow:hidden}
button,input,textarea{font:inherit;color:inherit}
button{background:none;border:0;padding:0;cursor:pointer;touch-action:manipulation}
label{touch-action:manipulation}
h1,h2,h3{margin:0;font-family:var(--f-display);font-weight:650;letter-spacing:-.01em;text-wrap:balance}
p{margin:0}
ul,ol{margin:0}
.num{font-variant-numeric:tabular-nums}
.ic{width:20px;height:20px;flex:none}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap;opacity:0}
:focus-visible{outline:2px solid var(--kcal);outline-offset:2px;border-radius:10px}
.muted{color:var(--muted)}
.eyebrow{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
.eyebrow.hot{color:var(--kcal-hot)}

main{max-width:560px;margin:0 auto;padding-top:8px;padding-bottom:calc(120px + env(safe-area-inset-bottom,0px))}
body.tab-today main{padding-bottom:calc(196px + env(safe-area-inset-bottom,0px))}
.view{display:flex;flex-direction:column;gap:24px;animation:viewIn .4s var(--ease)}
@keyframes viewIn{from{opacity:.35;transform:translateY(6px)}}

.offline{display:flex;align-items:center;gap:10px;padding:10px 14px;border-radius:14px;background:rgba(232,195,106,.1);color:var(--warn);font-size:13px;margin:8px 0 4px}

/* Today */
.day-head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;padding-top:10px}
.day-head h1{font-size:32px;line-height:1.05;margin-top:6px}
.day-nav{display:flex;gap:6px;align-items:center}
.icon-btn{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;background:var(--surface);color:var(--fg);transition:transform .3s var(--spring),background .2s;flex:none}
.icon-btn:active{transform:scale(.9)}
.icon-btn[disabled]{opacity:.3;pointer-events:none}
.icon-btn.ghost{background:transparent;color:var(--muted)}
.chip{position:relative;min-height:36px;padding:0 14px;border-radius:999px;background:var(--raised);font-size:13px;font-weight:600}
.chip::after{content:"";position:absolute;inset:-4px}

.hero{display:grid;grid-template-columns:minmax(0,172px) minmax(0,1fr);gap:22px;align-items:center}
.ring-wrap{position:relative;aspect-ratio:1/1;width:100%;max-width:172px}
.ring{width:100%;height:100%;display:block}
.ring-track{fill:none;stroke:var(--raised);stroke-width:13}
.ring-val{fill:none;stroke:url(#ringGrad);stroke-width:13;stroke-linecap:round;transition:stroke-dashoffset 1.1s var(--ease)}
.ring-val.over{stroke:var(--kcal-hot)}
.ring-val.zero{opacity:0}
.ring-c{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.ring-c b{font-family:var(--f-display);font-size:36px;font-weight:700;letter-spacing:-.02em;line-height:1}
.ring-c span{font-size:12px;color:var(--muted);margin-top:5px}
.hero-side{display:flex;flex-direction:column;gap:6px;min-width:0}
.big{font-family:var(--f-display);font-size:46px;font-weight:700;line-height:1;letter-spacing:-.03em}
.big small{font-family:var(--f-body);font-size:14px;font-weight:500;color:var(--muted);margin-left:6px;letter-spacing:0}
.hot{color:var(--kcal-hot)}
.sub{color:var(--muted);font-size:13px}

.macros{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px 14px}
.macros.minor{grid-template-columns:repeat(2,minmax(0,1fr));margin-top:-8px}
.mac{display:flex;flex-direction:column;gap:6px;min-width:0}
.mac-l{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px;white-space:nowrap}
.mac-l::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--c);flex:none}
.mac-l em{font-style:normal;color:var(--faint)}
.mac-v{font-size:12.5px;color:var(--faint);white-space:nowrap}
.mac-v b{font-family:var(--f-display);font-size:23px;font-weight:650;color:var(--fg);letter-spacing:-.01em}
.mac.mini .mac-v b{font-size:17px}
.mac.warn .mac-v b{color:var(--bad)}
.bar{height:6px;border-radius:6px;background:var(--raised);overflow:hidden}
.bar i{display:block;height:100%;border-radius:6px;background:var(--c);transform-origin:left center}
.anim .bar i{animation:fillX 1s var(--ease) both}
@keyframes fillX{from{transform:scaleX(0)}}

.sec-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:10px}
.sec-head h2{font-size:20px}
.link{display:inline-flex;align-items:center;gap:6px;min-height:44px;padding:0 2px;color:var(--kcal);font-weight:600;font-size:14px}
.link .ic{width:17px;height:17px}
.meal-list{display:flex;flex-direction:column;gap:8px}
.meal{display:grid;grid-template-columns:54px minmax(0,1fr) auto;align-items:center;gap:13px;width:100%;padding:10px 16px 10px 10px;border-radius:22px;background:var(--surface);text-align:left;min-height:74px;transition:transform .3s var(--spring)}
.meal:active{transform:scale(.985)}
.thumb{position:relative;width:54px;height:54px;border-radius:16px;background:var(--raised);display:grid;place-items:center;overflow:hidden;color:var(--muted);flex:none}
.thumb img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity .35s}
.thumb img.ld{opacity:1}
.meal-main{display:flex;flex-direction:column;gap:3px;min-width:0}
.meal-n{font-weight:600;display:flex;gap:8px;align-items:baseline}
.meal-time{font-size:12px;color:var(--faint);font-weight:500}
.meal-items{font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.meal-mac{display:flex;gap:10px;font-size:12px;color:var(--faint)}
.meal-mac i{font-style:normal;color:var(--c);font-weight:600;margin-right:2px}
.meal-k{text-align:right;display:flex;flex-direction:column;align-items:flex-end}
.meal-k b{font-family:var(--f-display);font-size:23px;font-weight:650;line-height:1.05}
.meal-k span{font-size:11px;color:var(--faint)}
.meal.empty{background:transparent;border:1px dashed var(--line);min-height:62px;grid-template-columns:42px minmax(0,1fr) auto;padding:9px 16px 9px 9px;cursor:pointer}
.meal.empty .thumb{width:42px;height:42px;border-radius:13px;background:var(--surface)}
.meal.empty .meal-n{color:var(--muted);font-weight:500}
.meal-plus{display:inline-flex;gap:6px;align-items:center;font-size:13px;font-weight:600;color:var(--kcal)}
.meal-plus .ic{width:17px;height:17px}
.hint-line{font-size:13.5px;color:var(--muted);margin-top:14px}
.hint-line b{color:var(--fg);font-weight:600}
.fine{font-size:12.5px;color:var(--muted)}
.fine.dim{color:var(--faint)}

/* Bottom: camera dock + tabs */
.bottom{position:fixed;left:0;right:0;bottom:0;z-index:30;padding:26px 16px calc(10px + env(safe-area-inset-bottom,0px));background:linear-gradient(to top,var(--bg) 66%,rgba(18,17,16,0));pointer-events:none}
.bottom-in{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:10px}
.bottom-in>*{pointer-events:auto}
.dock{display:flex;gap:10px}
.cam{flex:1;min-height:62px;border-radius:21px;display:flex;align-items:center;justify-content:center;gap:10px;background:linear-gradient(120deg,#FF9445 0%,#FF5A36 62%,#FF4433 100%);color:var(--on-kcal);font-weight:650;font-size:17px;box-shadow:0 16px 34px -16px rgba(255,90,54,.75);cursor:pointer;transition:transform .35s var(--spring)}
.cam .ic{width:25px;height:25px}
.gal{width:66px;min-height:62px;border-radius:21px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;background:var(--raised);border:1px solid var(--line);cursor:pointer;font-size:10.5px;font-weight:600;color:var(--muted);transition:transform .35s var(--spring)}
.cam:active,.gal:active{transform:scale(.95)}
.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;padding:5px;border-radius:22px;background:var(--surface);border:1px solid var(--line)}
.tab{min-height:50px;border-radius:17px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:11px;font-weight:600;color:var(--faint);transition:color .2s,background .25s}
.tab[aria-current="page"]{background:var(--raised);color:var(--fg)}

/* Buttons & form */
.btn{min-height:50px;border-radius:16px;padding:0 18px;font-weight:600;font-size:15px;display:inline-flex;align-items:center;justify-content:center;gap:8px;transition:transform .3s var(--spring),opacity .2s;cursor:pointer;text-align:center}
.btn:active{transform:scale(.97)}
.btn .ic{width:18px;height:18px}
.btn.primary{background:linear-gradient(120deg,#FF9445,#FF4A33);color:var(--on-kcal)}
.btn.ghost{background:var(--raised);color:var(--fg)}
.btn.danger{background:rgba(255,106,92,.1);color:var(--bad)}
.btn.danger-solid{background:var(--bad);color:#1C0705}
.btn.block{width:100%}
.btn.sq{width:54px;padding:0;flex:none}
.btn[disabled]{opacity:.45;pointer-events:none}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.input{width:100%;min-height:48px;background:var(--bg);border:1px solid var(--line);border-radius:14px;padding:0 14px;font-size:16px;color:var(--fg);transition:border-color .2s;-webkit-appearance:none;appearance:none}
textarea.input{padding:12px 14px;min-height:90px;resize:vertical;line-height:1.45}
.input:focus{outline:none;border-color:var(--kcal)}
.input::placeholder{color:var(--faint)}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field label,.flabel{font-size:12.5px;color:var(--muted);font-weight:500}
.fgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.fgrid.three{grid-template-columns:repeat(3,minmax(0,1fr))}
.unit{position:relative}
.unit .input{padding-right:46px}
.unit span{position:absolute;right:14px;top:50%;transform:translateY(-50%);color:var(--faint);font-size:13px;pointer-events:none}
.form-err{color:var(--bad);font-size:13px}
.form-err:empty{display:none}
.or{display:flex;align-items:center;gap:12px;color:var(--faint);font-size:12.5px}
.or::before,.or::after{content:"";flex:1;height:1px;background:var(--line)}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);background:var(--bg);border-radius:15px;padding:4px;gap:4px}
.seg button{min-height:44px;border-radius:11px;font-size:13px;font-weight:500;color:var(--muted);padding:0 4px;transition:background .25s,color .2s;white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--raised);color:var(--fg);font-weight:600}
input[type=range]{-webkit-appearance:none;appearance:none;flex:1;min-width:0;height:44px;background:transparent;margin:0}
input[type=range]::-webkit-slider-runnable-track{height:6px;border-radius:3px;background:linear-gradient(to right,var(--kcal) var(--p,50%),var(--raised) var(--p,50%))}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:28px;height:28px;border-radius:50%;background:var(--fg);margin-top:-11px;box-shadow:0 2px 10px rgba(0,0,0,.45)}
input[type=range]::-moz-range-track{height:6px;border-radius:3px;background:var(--raised)}
input[type=range]::-moz-range-progress{height:6px;border-radius:3px;background:var(--kcal)}
input[type=range]::-moz-range-thumb{width:28px;height:28px;border:0;border-radius:50%;background:var(--fg)}

/* Sheets */
.sheet-wrap{position:fixed;inset:0;z-index:50}
.sheet-backdrop{position:absolute;inset:0;background:rgba(6,5,4,.62);opacity:0;transition:opacity .3s var(--ease)}
.sheet{position:absolute;left:0;right:0;bottom:0;margin-inline:auto;max-width:560px;max-height:calc(100% - 26px - env(safe-area-inset-top,0px));overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;background:var(--surface);border-radius:28px 28px 0 0;padding-inline:16px;transform:translateY(105%);transition:transform .55s var(--spring);box-shadow:0 -24px 60px -24px rgba(0,0,0,.7),0 220px 0 0 var(--surface)}
.sheet:focus{outline:none}
.sheet-wrap.open .sheet{transform:translateY(0)}
.sheet-wrap.open .sheet-backdrop{opacity:1}
.sheet-head{position:sticky;top:0;z-index:3;background:var(--surface);padding:8px 0 10px}
.grab{display:block;width:40px;height:5px;border-radius:3px;background:var(--line);margin:0 auto 10px}
.sh-row{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
.sh-t{min-width:0}
.sh-t h2{font-size:23px}
.sh-t p{font-size:13px;color:var(--muted);margin-top:2px}
.sheet-body{display:flex;flex-direction:column;gap:14px;padding-bottom:calc(26px + env(safe-area-inset-bottom,0px))}
.sheet-body.has-foot{padding-bottom:0}
.sheet-foot{position:sticky;bottom:0;z-index:3;display:flex;flex-direction:column;gap:10px;padding-top:18px;padding-bottom:calc(12px + env(safe-area-inset-bottom,0px));background:linear-gradient(to bottom,rgba(27,26,23,0),var(--surface) 20px)}

/* Result */
.res-photo{position:relative;border-radius:20px;overflow:hidden;aspect-ratio:4/3;max-height:250px;width:100%;background:var(--raised);transition:max-height .5s var(--ease)}
.res-photo.small{max-height:150px}
.res-photo img{width:100%;height:100%;object-fit:cover;display:block;transition:filter .5s}
.scan{position:absolute;inset:0;display:none;background:linear-gradient(to bottom,rgba(255,122,61,0) 38%,rgba(255,122,61,.5) 50%,rgba(255,122,61,0) 62%);background-size:100% 260%;animation:scan 1.9s var(--ease) infinite alternate}
.scanning .scan{display:block}
.scanning img{filter:saturate(.55) brightness(.75)}
@keyframes scan{from{background-position:0 100%}to{background-position:0 0}}
.res-quote{margin:0;padding:12px 14px;border-radius:16px;background:var(--bg);color:var(--muted);font-size:14px}
.res-status{display:flex;align-items:center;gap:12px;font-weight:500;min-height:44px}
.dots{display:inline-flex;gap:5px}
.dots i{width:7px;height:7px;border-radius:50%;background:var(--kcal);animation:dot 1.1s ease-in-out infinite}
.dots i:nth-child(2){animation-delay:.15s}
.dots i:nth-child(3){animation-delay:.3s}
@keyframes dot{0%,80%,100%{transform:scale(.5);opacity:.4}40%{transform:scale(1);opacity:1}}
.res-head h3{font-size:19px}
.res-head p{font-size:13px;color:var(--muted);margin-top:2px}
.res-items{list-style:none;padding:0;display:flex;flex-direction:column;gap:10px}
.res-item{background:var(--bg);border-radius:18px;padding:8px 6px 10px 14px;display:flex;flex-direction:column;gap:2px;animation:itemIn .5s var(--spring) both}
.res-item:nth-child(2){animation-delay:.05s}.res-item:nth-child(3){animation-delay:.1s}.res-item:nth-child(4){animation-delay:.15s}
@keyframes itemIn{from{opacity:.2;transform:translateY(10px) scale(.98)}}
.ri-top{display:flex;align-items:center;gap:6px}
.ri-name{flex:1;min-width:0;background:transparent;border:0;border-bottom:1px dashed var(--line);font-size:16px;font-weight:600;padding:8px 0;color:var(--fg);border-radius:0}
.ri-name:focus{outline:none;border-bottom-color:var(--kcal)}
.conf{font-size:11px;font-weight:600;padding:3px 8px;border-radius:999px;white-space:nowrap}
.conf.hi{color:var(--ok);background:rgba(118,212,179,.12)}
.conf.mid{color:var(--warn);background:rgba(232,195,106,.12)}
.conf.lo{color:var(--bad);background:rgba(255,106,92,.12)}
.ed{display:flex;flex-direction:column;gap:2px;padding-right:8px}
.ed-g{display:flex;align-items:center;gap:12px}
.gbox{display:flex;align-items:center;gap:5px;flex:none}
.gbox .input{width:78px;text-align:right;min-height:44px;padding:0 10px}
.gbox span{color:var(--muted);font-size:13px}
.ed-vals{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:12.5px;color:var(--muted)}
.ed-vals b{color:var(--fg);font-weight:650}
.ed-vals span{display:inline-flex;align-items:center;gap:5px}
.ed-vals i{width:6px;height:6px;border-radius:50%}
.tot{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap}
.tot .tk{color:var(--muted);font-size:13px}
.tot .tk b{font-family:var(--f-display);font-size:30px;font-weight:700;color:var(--fg);letter-spacing:-.02em}
.tot .tm{font-size:13px;color:var(--muted)}
.res-error{background:rgba(255,106,92,.08);border-radius:18px;padding:14px 16px;display:flex;flex-direction:column;gap:4px}
.res-error .t{font-weight:650}
.res-error p:not(.t){color:var(--muted);font-size:14px}
.note{font-size:13px;color:var(--muted);background:var(--bg);border-radius:14px;padding:10px 12px}
.note b{color:var(--fg);margin-right:6px;font-weight:600}
details.hint summary{min-height:44px;display:flex;align-items:center;color:var(--muted);font-size:14px;cursor:pointer;list-style:none}
details.hint summary::-webkit-details-marker{display:none}
details.hint summary::after{content:"+";margin-left:auto;font-size:18px;color:var(--faint)}
details.hint[open] summary::after{content:"–"}
details.hint[open]{display:flex;flex-direction:column;gap:10px}

/* Meal detail */
.m-sum{display:grid;grid-template-columns:auto minmax(0,1fr);gap:20px;align-items:center;padding:2px 0 4px}
.m-kcal b{font-family:var(--f-display);font-size:44px;font-weight:700;line-height:1;display:block;letter-spacing:-.03em}
.m-kcal span{font-size:13px;color:var(--muted)}
.m-macs{display:grid;grid-template-columns:minmax(0,1fr);gap:4px}
.m-mac{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted);min-width:0;white-space:nowrap}
.m-mac b{margin-left:auto;color:var(--fg);font-weight:600}
.dot{width:7px;height:7px;border-radius:50%;flex:none}
.entry{background:var(--bg);border-radius:22px;padding:12px;display:flex;flex-direction:column;gap:10px}
.thumb.entry-photo{width:100%;height:auto;aspect-ratio:16/10;border-radius:16px}
.entry-meta{display:flex;justify-content:space-between;align-items:baseline;font-size:13px;color:var(--muted);padding:0 4px}
.entry-meta b{color:var(--fg);font-size:15px}
.eitems{list-style:none;padding:0;display:flex;flex-direction:column}
.eitem{border-top:1px solid var(--line)}
.eitem:first-child{border-top:0}
.eitem-row{display:grid;grid-template-columns:minmax(0,1fr) auto 50px;gap:10px;align-items:center;width:100%;min-height:50px;text-align:left;padding:0 4px}
.eitem-row .nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.eitem-row .g{color:var(--muted);font-size:13px}
.eitem-row .k{text-align:right;font-weight:650}
.eitem.open .eitem-row .nm{color:var(--kcal)}
.eitem-ed{display:flex;flex-direction:column;gap:8px;padding:2px 4px 12px}
.eitem-none{color:var(--faint);font-size:13px;padding:8px 4px}
.entry-type{display:flex;flex-direction:column;gap:6px}
.entry-type>span{font-size:12px;color:var(--faint);padding-left:4px}

.entry-actions{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.m-add{display:flex;gap:10px}

.page-head{padding-top:10px}
.page-head h1{font-size:32px;margin-top:6px}
.h-sum{display:flex;justify-content:space-between;align-items:flex-end;gap:12px}
.h-sum-r{text-align:right;font-size:13px;color:var(--muted)}
.h-sel{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 12px;font-size:13px;color:var(--muted);min-height:22px;margin-bottom:-12px}
.h-sel b{color:var(--fg);font-size:15px}
.chart svg{display:block;width:100%;height:auto;overflow:visible}
.chart .grid{stroke:var(--line);stroke-width:1}
.chart .goal{stroke:var(--fg);stroke-opacity:.45;stroke-dasharray:4 4}
.chart .ax{fill:var(--faint);font:500 10px var(--f-body)}
.chart .ax.on{fill:var(--fg);font-weight:700}
.chart .goal-t{fill:var(--muted);paint-order:stroke;stroke:var(--bg);stroke-width:3px}
.chart .b{fill:var(--kcal);opacity:.6;transform-box:fill-box;transform-origin:50% 100%;transition:opacity .25s}
.chart .over .b{fill:var(--kcal-hot)}
.chart .sel .b{opacity:1}
.chart .b0{fill:var(--line)}
.chart g[data-act]{cursor:pointer}
.chart.anim .b{animation:grow .7s var(--ease) both}
@keyframes grow{from{transform:scaleY(0)}}
.dist{display:flex;height:14px;border-radius:8px;overflow:hidden;gap:3px}
.dist i{display:block;min-width:4px}
.dist-leg{list-style:none;margin-top:12px;padding:0;display:flex;flex-direction:column;gap:8px}
.dist-leg li{display:grid;grid-template-columns:auto minmax(0,1fr) auto auto;gap:10px;align-items:center;font-size:14px}
.dist-leg .g{min-width:84px;text-align:right;color:var(--muted)}
.dist-minor{margin-top:10px;font-size:13px;color:var(--muted)}
.day-list{list-style:none;padding:0;display:flex;flex-direction:column}
.day-row{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr) 62px;gap:12px;align-items:center;width:100%;min-height:50px;text-align:left;border-top:1px solid var(--line)}
.day-list li:first-child .day-row{border-top:0}
.db{height:6px;border-radius:6px;background:var(--raised);overflow:hidden}
.db i{display:block;height:100%;background:var(--kcal);border-radius:6px}
.db i.over{background:var(--kcal-hot)}
.day-row b{text-align:right;font-weight:600}

/* Settings */
.group{background:var(--surface);border-radius:24px;padding:18px 16px;display:flex;flex-direction:column;gap:14px}
.group h2{font-size:19px}
.seg-row{display:flex;flex-direction:column;gap:6px}
.seg-row>span{font-size:12.5px;color:var(--muted);font-weight:500}
.rec{border-top:1px solid var(--line);padding-top:14px;display:flex;flex-direction:column;gap:8px}
.rec-top{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.rec-top b{font-family:var(--f-display);font-size:36px;font-weight:700;line-height:1;letter-spacing:-.02em}
.steps{padding-left:20px;display:flex;flex-direction:column;gap:6px;color:var(--muted);font-size:14px}
.steps b{color:var(--fg);font-weight:600}
.bk-out{display:flex;flex-direction:column;gap:10px}
.progress{height:6px;border-radius:6px;background:var(--raised);overflow:hidden}
.progress i{display:block;height:100%;background:var(--kcal);transition:width .3s}

/* Toast */
.toast{position:fixed;left:16px;right:16px;margin-inline:auto;max-width:440px;bottom:calc(98px + env(safe-area-inset-bottom,0px));z-index:80;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 10px 10px 16px;min-height:52px;border-radius:17px;background:var(--fg);color:var(--bg);font-weight:500;font-size:14px;box-shadow:0 14px 40px -12px rgba(0,0,0,.7);transform:translateY(16px);opacity:0;pointer-events:none;transition:transform .45s var(--spring),opacity .25s}
.toast.show{transform:none;opacity:1;pointer-events:auto}
.toast button{min-height:38px;padding:0 14px;border-radius:11px;background:var(--bg);color:var(--fg);font-weight:600;font-size:13px;flex:none}
body.tab-today .toast{bottom:calc(178px + env(safe-area-inset-bottom,0px))}
body.has-sheet .toast{bottom:auto;top:calc(12px + env(safe-area-inset-top,0px));transform:translateY(-16px)}
body.has-sheet .toast.show{transform:none}

@media (min-width:600px){ .hero{grid-template-columns:200px minmax(0,1fr)} .ring-wrap{max-width:200px} }
@media (max-width:360px){ .hero{grid-template-columns:minmax(0,140px) minmax(0,1fr);gap:16px} .big{font-size:38px} .ring-c b{font-size:29px} .macros{gap:14px 10px} .mac-v b{font-size:19px} .seg button{font-size:12px} }
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
  .scanning .scan{animation:none;background:rgba(255,122,61,.14)}
}

/* Standalone app additions */
[hidden]:not([hidden=until-found i]){display:none!important}
img{max-width:100%}
body{padding-top:env(safe-area-inset-top,0px);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));min-height:100vh;min-height:100dvh}
a{color:var(--kcal);text-underline-offset:2px;text-decoration-thickness:1px}

.check{display:flex;align-items:center;gap:10px;min-height:44px;font-size:14px;color:var(--muted);cursor:pointer}

.t-ok{color:var(--ok)}
.t-bad{color:var(--bad)}

<body>
<div id="app" lang="tr">
  <main>
    <div class="offline" id="offline" role="status" hidden></div>
    <section class="view" id="v-today" aria-label="Bugün"></section>
    <section class="view" id="v-history" aria-label="Geçmiş" hidden></section>
    <section class="view" id="v-settings" aria-label="Ayarlar" hidden></section>
  </main>
  <div class="bottom"><div class="bottom-in" id="bottom"></div></div>
  <input class="vh" type="file" id="in-cam" accept="image/*" capture="environment" tabindex="-1" aria-hidden="true">
  <input class="vh" type="file" id="in-gal" accept="image/*" tabindex="-1" aria-hidden="true">
  <input class="vh" type="file" id="in-backup" accept="application/json,.json" tabindex="-1" aria-hidden="true">
  <div id="sheets"></div>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
</div>

<script>
(function () {
'use strict';

/* ---------------- helpers ---------------- */
const $ = (s, r) => (r || document).querySelector(s);
const $$ = (s, r) => Array.from((r || document).querySelectorAll(s));
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const clone = o => JSON.parse(JSON.stringify(o));
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const num = v => { const n = Number(v); return Number.isFinite(n) && n > 0 ? n : 0; };
const parseNum = s => { const n = Number(String(s == null ? '' : s).replace(',', '.').replace(/[^\d.]/g, '')); return Number.isFinite(n) && n > 0 ? n : 0; };
const NF0 = new Intl.NumberFormat('tr-TR', { maximumFractionDigits: 0 });
const NF1 = new Intl.NumberFormat('tr-TR', { maximumFractionDigits: 1 });
const fk = n => NF0.format(Math.round(n || 0));
const fg = n => { n = n || 0; return n >= 10 ? NF0.format(Math.round(n)) : NF1.format(Math.round(n * 10) / 10); };
const newId = () => { try { return crypto.randomUUID().replace(/-/g, '').slice(0, 20); } catch (e) { return (Date.now().toString(36) + Math.random().toString(36).slice(2, 12)).slice(0, 20); } };
const isIOS = () => /iPad|iPhone|iPod/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
const isStandalone = () => { try { return window.matchMedia('(display-mode: standalone)').matches || navigator.standalone === true; } catch (e) { return false; } };

const WD = ['Paz', 'Pzt', 'Sal', 'Çar', 'Per', 'Cum', 'Cmt'];
const WD_LONG = ['Pazar', 'Pazartesi', 'Salı', 'Çarşamba', 'Perşembe', 'Cuma', 'Cumartesi'];
const MO = ['Oca', 'Şub', 'Mar', 'Nis', 'May', 'Haz', 'Tem', 'Ağu', 'Eyl', 'Eki', 'Kas', 'Ara'];
const MO_LONG = ['Ocak', 'Şubat', 'Mart', 'Nisan', 'Mayıs', 'Haziran', 'Temmuz', 'Ağustos', 'Eylül', 'Ekim', 'Kasım', 'Aralık'];
const pad = n => String(n).padStart(2, '0');
const dayKey = d => { d = d || new Date(); return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); };
const parseDay = k => { const p = k.split('-').map(Number); return new Date(p[0], p[1] - 1, p[2]); };
const addDays = (k, n) => { const d = parseDay(k); d.setDate(d.getDate() + n); return dayKey(d); };
const todayKey = () => dayKey(new Date());
const longDate = k => { const d = parseDay(k); return d.getDate() + ' ' + MO_LONG[d.getMonth()] + (d.getFullYear() !== new Date().getFullYear() ? ' ' + d.getFullYear() : ''); };
const timeOf = ts => { const d = new Date(ts); return pad(d.getHours()) + ':' + pad(d.getMinutes()); };
function eyebrowFor(k) {
  const t = todayKey(), w = WD_LONG[parseDay(k).getDay()];
  if (k === t) return 'Bugün · ' + w;
  if (k === addDays(t, -1)) return 'Dün · ' + w;
  return w;
}
function dayName(k) {
  const t = todayKey();
  if (k === t) return 'Bugün';
  if (k === addDays(t, -1)) return 'Dün';
  const d = parseDay(k);
  return d.getDate() + ' ' + MO_LONG[d.getMonth()] + ' ' + WD[d.getDay()];
}
function typeForHour(h) {
  if (h >= 5 && h < 11) return 'breakfast';
  if (h >= 11 && h < 16) return 'lunch';
  if (h >= 18 && h < 23) return 'dinner';
  return 'snack';
}

/* ---------------- icons ---------------- */
const ICONS = {
  camera: '<path d="M4 8.5h2.8L8.4 6h7.2l1.6 2.5H20a1 1 0 0 1 1 1V18a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V9.5a1 1 0 0 1 1-1z"/><circle cx="12" cy="13.5" r="3.4"/>',
  image: '<rect x="3.5" y="4.5" width="17" height="15" rx="2.5"/><circle cx="9" cy="9.5" r="1.6"/><path d="M20.5 15.5 16 11l-8.5 8.5"/>',
  plus: '<path d="M12 5v14M5 12h14"/>',
  x: '<path d="m6.5 6.5 11 11M17.5 6.5l-11 11"/>',
  chevL: '<path d="M14.5 5.5 8 12l6.5 6.5"/>',
  chevR: '<path d="M9.5 5.5 16 12l-6.5 6.5"/>',
  plate: '<circle cx="12" cy="12" r="8.5"/><circle cx="12" cy="12" r="4.5"/>',
  bars: '<path d="M5 19.5v-7M10 19.5v-14M15 19.5v-9M20 19.5v-12"/>',
  sliders: '<path d="M4 7h9M17 7h3M4 17h3M11 17h9"/><circle cx="15" cy="7" r="2"/><circle cx="9" cy="17" r="2"/>',
  trash: '<path d="M4.5 7h15M9.5 7V4.5h5V7M6.5 7l.9 12.1a1.5 1.5 0 0 0 1.5 1.4h6.2a1.5 1.5 0 0 0 1.5-1.4L17.5 7M10 11v6M14 11v6"/>',
  download: '<path d="M12 4v11M7.5 10.5 12 15l4.5-4.5M5 19.5h14"/>',
  upload: '<path d="M12 15.5v-11M7.5 9 12 4.5 16.5 9M5 19.5h14"/>',
  sun: '<circle cx="12" cy="12" r="3.8"/><path d="M12 3v2M12 19v2M3 12h2M19 12h2M5.6 5.6 7 7M17 17l1.4 1.4M5.6 18.4 7 17M17 7l1.4-1.4"/>',
  sunrise: '<path d="M3 18.5h18M6.5 18.5a5.5 5.5 0 0 1 11 0M12 5v3.5M4.6 11.1l1.6 1.2M19.4 11.1l-1.6 1.2M9.5 7 12 5l2.5 2"/>',
  moon: '<path d="M19.5 14.6A7.8 7.8 0 1 1 9.4 4.5a6.2 6.2 0 0 0 10.1 10.1z"/>',
  apple: '<path d="M12 8.2c-1.2-1-4.6-1.6-6 1-1.6 3 .4 10.3 3.6 10.3.9 0 1.5-.5 2.4-.5s1.5.5 2.4.5c3.2 0 5.2-7.3 3.6-10.3-1.4-2.6-4.8-2-6-1z"/><path d="M12 8.2c0-2 .9-3.6 2.8-4.2"/>',
  pen: '<path d="M4.5 19.5h4l10-10a2.1 2.1 0 0 0-3-3l-10 10v3z"/><path d="m13.5 8.5 2 2"/>',
  eye: '<path d="M2.5 12S6 5.5 12 5.5 21.5 12 21.5 12 18 18.5 12 18.5 2.5 12 2.5 12z"/><circle cx="12" cy="12" r="3"/>',
  key: '<circle cx="8" cy="15" r="3.5"/><path d="m10.5 12.5 8-8M15.5 7.5l2.5 2.5M17.5 5.5l2 2"/>',
  wifiOff: '<path d="m3 3 18 18M8.6 15.6a4.8 4.8 0 0 1 6.1-.4M5 12a9.7 9.7 0 0 1 4.3-2.4M19 12a9.7 9.7 0 0 0-2.6-1.8M2 8.6a14.6 14.6 0 0 1 4.6-2.8M22 8.6A14.6 14.6 0 0 0 11 5"/><circle cx="12" cy="19" r="1" fill="currentColor" stroke="none"/>'
};
const ic = name => '<svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' + (ICONS[name] || '') + '</svg>';

/* ---------------- nutrition model ---------------- */
const NUT = ['calories', 'protein_g', 'carbs_g', 'fat_g', 'fiber_g', 'sugar_g'];
const MAC = [
  { k: 'protein_g', g: 'protein', label: 'Protein', s: 'P', c: 'var(--pro)' },
  { k: 'carbs_g', g: 'carbs', label: 'Karbonhidrat', s: 'K', c: 'var(--carb)' },
  { k: 'fat_g', g: 'fat', label: 'Yağ', s: 'Y', c: 'var(--fat)' },
  { k: 'fiber_g', g: 'fiber', label: 'Lif', s: 'Lif', c: 'var(--fib)' },
  { k: 'sugar_g', g: 'sugar', label: 'Şeker', s: 'Şeker', c: 'var(--sug)', limit: true }
];
const TYPES = [
  { k: 'breakfast', label: 'Kahvaltı', added: 'Kahvaltıya eklendi', moved: 'Kahvaltıya taşındı', icon: 'sunrise' },
  { k: 'lunch', label: 'Öğle', added: 'Öğle yemeğine eklendi', moved: 'Öğle yemeğine taşındı', icon: 'sun' },
  { k: 'dinner', label: 'Akşam', added: 'Akşam yemeğine eklendi', moved: 'Akşam yemeğine taşındı', icon: 'moon' },
  { k: 'snack', label: 'Atıştırmalık', added: 'Atıştırmalıklara eklendi', moved: 'Atıştırmalıklara taşındı', icon: 'apple' }
];
const typeOf = k => TYPES.find(t => t.k === k) || TYPES[3];
const ACT = {
  sedentary: { f: 1.2, label: 'Hareketsiz', d: 'Masa başı iş, düzenli egzersiz yok.' },
  light: { f: 1.375, label: 'Az', d: 'Haftada 1–3 gün hafif egzersiz ya da gün içinde yürüyüş.' },
  moderate: { f: 1.55, label: 'Orta', d: 'Haftada 3–5 gün orta tempolu egzersiz.' },
  active: { f: 1.725, label: 'Yoğun', d: 'Haftada 6–7 gün yoğun egzersiz ya da fiziksel iş.' }
};
const zero = () => ({ calories: 0, protein_g: 0, carbs_g: 0, fat_g: 0, fiber_g: 0, sugar_g: 0 });
const CAPS = { calories: 900, protein_g: 100, carbs_g: 100, fat_g: 100, fiber_g: 100, sugar_g: 100 };
const defaultMax = g => Math.max(300, Math.ceil(g * 2.5 / 50) * 50);
function itemVals(it) { const f = (it.grams || 0) / 100, o = zero(); for (const k of NUT) o[k] = ((it.per100 && it.per100[k]) || 0) * f; return o; }
function sumItems(items) { const o = zero(); for (const it of items) { const v = itemVals(it); for (const k of NUT) o[k] += v[k]; } return o; }
function sumEntries(list) { const o = zero(); for (const e of list) { const v = sumItems(e.items); for (const k of NUT) o[k] += v[k]; } return o; }

function cleanItem(it) {
  if (!it || typeof it !== 'object') return null;
  const p = it.per100 || {}, per100 = {};
  for (const k of NUT) per100[k] = clamp(num(p[k]), 0, CAPS[k]);
  const grams = clamp(num(it.grams), 0, 5000);
  const conf = it.conf == null || it.conf === '' ? null : clamp(Number(it.conf) || 0, 0, 1);
  const max = clamp(Math.max(num(it.max) || defaultMax(grams), grams), 50, 5000);
  return { name: String(it.name || 'Yemek').trim().slice(0, 80) || 'Yemek', grams, per100, conf, max };
}
// Build an item from values given for a whole portion. Grams are raised if the values are physically impossible for that weight.
function itemFromPortion(name, grams, vals, conf) {
  let g = num(grams) || 100;
  const need = Math.max(num(vals.calories) / 9, num(vals.protein_g), num(vals.carbs_g), num(vals.fat_g), num(vals.fiber_g), num(vals.sugar_g));
  if (need > g) g = Math.ceil(need);
  const per100 = {};
  for (const k of NUT) per100[k] = num(vals[k]) / g * 100;
  return cleanItem({ name, grams: g, per100, conf, max: defaultMax(g) });
}
const ID_RE = /^[A-Za-z0-9_-]{4,64}$/;
const DAY_RE = /^\d{4}-\d{2}-\d{2}$/;
function cleanEntry(e) {
  if (!e || typeof e !== 'object' || !ID_RE.test(String(e.id || '')) || !DAY_RE.test(String(e.day || ''))) return null;
  const items = (Array.isArray(e.items) ? e.items : []).map(cleanItem).filter(Boolean).slice(0, 40);
  return {
    id: e.id, day: e.day, ts: Number(e.ts) || Date.now(), type: typeOf(e.type).k, items,
    notes: String(e.notes || '').slice(0, 400), hasPhoto: !!e.hasPhoto,
    source: ['photo', 'text', 'manual'].includes(e.source) ? e.source : 'manual', v: 1
  };
}

const DEFAULTS = { goal: { kcal: 2000, protein: 120, carbs: 225, fat: 65, fiber: 28, sugar: 50 }, profile: { height: null, weight: null, age: null, sex: null, activity: 'light', target: 'keep' } };
function mergeSettings(s) {
  const o = clone(DEFAULTS);
  if (s && typeof s === 'object') {
    if (s.goal) for (const k in o.goal) { const v = num(s.goal[k]); if (v) o.goal[k] = Math.round(Math.min(v, k === 'kcal' ? 10000 : 2000)); }
    if (s.profile) {
      const p = s.profile;
      for (const k of ['height', 'weight', 'age']) o.profile[k] = num(p[k]) || null;
      if (p.sex === 'female' || p.sex === 'male') o.profile.sex = p.sex;
      if (ACT[p.activity]) o.profile.activity = p.activity;
      if (['lose', 'keep', 'gain'].includes(p.target)) o.profile.target = p.target;
    }
  }
  return o;
}
function recommend(p) {
  const h = num(p.height), w = num(p.weight), a = num(p.age);
  if (!(h >= 120 && h <= 230 && w >= 30 && w <= 300 && a >= 15 && a <= 100 && p.sex)) return null;
  const bmr = 10 * w + 6.25 * h - 5 * a + (p.sex === 'male' ? 5 : -161);
  const tdee = bmr * (ACT[p.activity] || ACT.light).f;
  let kcal = p.target === 'lose' ? tdee - 500 : p.target === 'gain' ? tdee + 300 : tdee;
  const floor = p.sex === 'male' ? 1500 : 1200;
  const floored = kcal < floor;
  kcal = Math.round(Math.max(kcal, floor) / 10) * 10;
  const protein = Math.round(w * (p.target === 'keep' ? 1.6 : 1.8));
  const fat = Math.round(kcal * 0.28 / 9);
  const carbs = Math.max(0, Math.round((kcal - protein * 4 - fat * 9) / 4));
  return { bmr, tdee, kcal, protein, fat, carbs, fiber: Math.round(kcal / 1000 * 14), sugar: Math.round(kcal * 0.1 / 4), floored };
}

const AI_DEFAULT = { key: '', model: 'auto', custom: '', lastUsed: '' };

const cleanKey = k => String(k || '').replace(/[\s"'`]/g, '').slice(0, 200);

/* ---------------- on-device storage (IndexedDB, with fallbacks) ---------------- */
const LS = {
  get(k) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : null; } catch (e) { return null; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); return true; } catch (e) { return false; } },
  del(k) { try { localStorage.removeItem(k); } catch (e) { /* ignore */ } }

const fullErr = e => (e && (e.name === 'QuotaExceededError' || e.code === 22 || e.code === 'local_full')) ? { code: 'local_full' } : (e && e.code ? e : { code: 'store', msg: String((e && (e.message || e.name)) || e) });

const Store = {
  kind: 'mem', db: null, mem: { meals: {}, photos: {}, kv: {} },
  async init() {
    try { this.db = await this.open(); this.kind = 'idb'; return; } catch (e) { /* fall through */ }
    try { localStorage.setItem('lokma.t', '1'); localStorage.removeItem('lokma.t'); this.kind = 'ls'; this.mem.meals = LS.get('lokma.meals') || {}; this.mem.kv = LS.get('lokma.kv') || {}; }
    catch (e) { this.kind = 'mem'; }
  },
  open() {
    return new Promise((resolve, reject) => {
      if (!window.indexedDB) { reject(new Error('no idb')); return; }
      let rq;
      try { rq = indexedDB.open('lokma', 1); } catch (e) { reject(e); return; }
      rq.onupgradeneeded = () => {
        const d = rq.result;
        if (!d.objectStoreNames.contains('meals')) d.createObjectStore('meals', { keyPath: 'id' });
        if (!d.objectStoreNames.contains('photos')) d.createObjectStore('photos');
        if (!d.objectStoreNames.contains('kv')) d.createObjectStore('kv');
      };
      rq.onsuccess = () => { const d = rq.result; d.onversionchange = () => d.close(); resolve(d); };
      rq.onerror = () => reject(rq.error);
      rq.onblocked = () => reject(new Error('blocked'));
    });
  },
  tx(store, mode, fn) {
    return new Promise((resolve, reject) => {
      let t, out;
      try { t = this.db.transaction(store, mode); } catch (e) { reject(fullErr(e)); return; }
      const r = fn(t.objectStore(store));
      if (r) r.onsuccess = () => { out = r.result; };
      t.oncomplete = () => resolve(out);
      t.onerror = () => reject(fullErr(t.error));
      t.onabort = () => reject(fullErr(t.error || new Error('abort')));
    });
  },
  persistLS() { if (this.kind === 'ls' && (!LS.set('lokma.meals', this.mem.meals) || !LS.set('lokma.kv', this.mem.kv))) throw { code: 'local_full' }; },
  async loadMeals() { return this.kind === 'idb' ? this.tx('meals', 'readonly', s => s.getAll()) : Object.values(this.mem.meals); },
  async putMeal(e) {
    if (this.kind === 'idb') return this.tx('meals', 'readwrite', s => { s.put(e); });
    this.mem.meals[e.id] = clone(e); this.persistLS();
  },
  async putMeals(list) {
    if (this.kind === 'idb') return this.tx('meals', 'readwrite', s => { for (const e of list) s.put(e); });
    for (const e of list) this.mem.meals[e.id] = clone(e); this.persistLS();
  },
  async delMeal(id) {
    if (this.kind === 'idb') return this.tx('meals', 'readwrite', s => { s.delete(id); });
    delete this.mem.meals[id]; this.persistLS();
  },
  async getPhoto(id) {
    if (this.kind === 'idb') return this.tx('photos', 'readonly', s => s.get(id));
    return this.kind === 'ls' ? LS.get('lokma.photo.' + id) : this.mem.photos[id];
  },
  async putPhotos(map) {
    const ids = Object.keys(map);
    if (!ids.length) return;
    if (this.kind === 'idb') return this.tx('photos', 'readwrite', s => { for (const id of ids) s.put(map[id], id); });
    for (const id of ids) {
      if (this.kind === 'ls') { if (!LS.set('lokma.photo.' + id, map[id])) throw { code: 'local_full' }; }
      else this.mem.photos[id] = map[id];
    }
  },
  putPhoto(id, v) { return this.putPhotos({ [id]: v }); },
  async delPhoto(id) {
    if (this.kind === 'idb') return this.tx('photos', 'readwrite', s => { s.delete(id); });

  },
  async getKV(k) { return this.kind === 'idb' ? this.tx('kv', 'readonly', s => s.get(k)) : this.mem.kv[k]; },
  async setKV(k, v) {

function queueWrite(key, fn) {
  const prev = S.chains.get(key) || Promise.resolve();
  const next = prev.catch(() => {}).then(fn);
  S.chains.set(key, next);
  const done = () => { if (S.chains.get(key) === next) S.chains.delete(key); };
  next.then(done, done);

}

  return 'Kaydedilemedi. Uygulamayı kapatıp yeniden açmayı dene.';
}

async function saveEntry(entry, thumb) {
  const prev = S.entries.get(entry.id);

  requestRender();
  try {
    if (thumb) {
      try { await queueWrite('p:' + entry.id, () => Store.putPhoto(entry.id, thumb)); }
      catch (e) { entry.hasPhoto = false; toast('Fotoğraf önizlemesi saklanamadı, depolama dolu.'); }
    }
    await queueWrite(entry.id, () => Store.putMeal(clone(entry)));
  } catch (e) {
    if (prev) S.entries.set(entry.id, prev); else S.entries.delete(entry.id);

}
function touchEntry(id) {

    S.dirty.delete(id);
    const cur = S.entries.get(id);

  }, 400));
}
async function removeEntry(id) {

  S.entries.delete(id);

    await queueWrite(id, () => Store.delMeal(id));

  } catch (err) {

  }

/* ---------------- boot ---------------- */

/* ---------------- sheets ---------------- */
const stack = [];
function openSheet(id, ctx, render) {
  const wrap = document.createElement('div');

  $('#sheets').appendChild(wrap);

  stack.push(sh);

  requestAnimationFrame(() => requestAnimationFrame(() => { wrap.classList.add('open'); try { sh.el.focus({ preventScroll: true }); } catch (e) { /* ignore */ } }));
  return sh;
}

function loadImage(file) {
  return new Promise((resolve, reject) => {
    const url = URL.createObjectURL(file);
    const img = new Image();
    img.onload = () => { resolve(img); setTimeout(() => URL.revokeObjectURL(url), 2000); };
    img.onerror = () => { URL.revokeObjectURL(url); reject(new Error('decode')); };
    img.src = url;
  });
}
function scaleCanvas(img, max) {
  const w = img.naturalWidth || img.width, h = img.naturalHeight || img.height;
  const s = Math.min(1, max / Math.max(w, h));
  const c = document.createElement('canvas');
  c.width = Math.max(1, Math.round(w * s)); c.height = Math.max(1, Math.round(h * s));
  const x = c.getContext('2d');
  x.fillStyle = '#ffffff'; x.fillRect(0, 0, c.width, c.height);
  x.imageSmoothingQuality = 'high';
  x.drawImage(img, 0, 0, c.width, c.height);
  return c;
}
const toBlob = (c, q) => new Promise((res, rej) => c.toBlob(b => (b ? res(b) : rej(new Error('blob'))), 'image/jpeg', q));

  L.push('- "name": a natural, specific Turkish food name, e.g. "Mercimek çorbası", "Tereyağlı pirinç pilavı", "Izgara tavuk göğsü", "Çoban salata". Mention the cooking method when it is visible or stated.');
  if (photoMode) L.push('- "estimated_grams": the edible amount you can see, in grams (drinks: 1 ml ≈ 1 g). Judge size against reference objects in the photo: dinner plate ≈ 26 cm across, side plate ≈ 20 cm, soup bowl ≈ 300 ml, fork ≈ 19 cm, spoon ≈ 15 cm, Turkish tea glass ≈ 100 ml, water glass ≈ 200–250 ml, one slice of bread ≈ 30 g. With no reference object, assume a standard dinner plate.');
  else L.push('- "estimated_grams": use the amounts the user gives (convert cups, slices, spoons and pieces to grams). When no amount is given, assume one standard Turkish portion and say so in notes.');
  L.push('- Nutrition values are for the whole estimated portion, not per 100 g. Include cooking oil, butter, sauces and dressings in the item they belong to. Use typical values for Turkish home and restaurant cooking.');
  L.push('- "confidence" from 0.0 to 1.0 covers both identification and portion size. Lower it when food is hidden, mixed, blurry or hard to size; go below 0.5 when you are guessing.');

function tolerantParse(t) {

  let s = String(t).trim();
  const f = s.match(/```(?:json)?\s*([\s\S]*?)```/i);
  if (f) s = f[1];
  const a = s.indexOf('{'), b = s.lastIndexOf('}');
  if (a < 0 || b <= a) {
    const a2 = s.indexOf('['), b2 = s.lastIndexOf(']');
    if (a2 < 0 || b2 <= a2) return null;
    try { return JSON.parse(s.slice(a2, b2 + 1)); } catch (e) { return null; }

    for (const k of NUT) vals[k] = num(it[k]);

function httpErr(status, data, txt) {

  else if (status === 429 || /resource_exhausted/.test(blob)) code = 'rate_limited';
  else if (status === 401 || status === 403) code = 'forbidden';

  let out = '';

  for (const s of steps) {
    if (!s || typeof s !== 'object') continue;
    if (s.type === 'model_output' && Array.isArray(s.content)) {
      for (const c of s.content) if (c && c.type === 'text' && typeof c.text === 'string') out += c.text;
    } else if (s.type === 'text' && typeof s.text === 'string') {

async function viaInteractions(model, p, signal, safe) {

async function withModels(signal, fn) {
  const errs = [];
  for (const m of modelChain()) {
    const until = S.skip.get(m);
    if (until && until > Date.now()) {
      errs.push(until === Infinity ? { code: 'not_found', model: m } : { code: 'rate_limited', model: m, retryAfter: Math.ceil((until - Date.now()) / 1000) });
      continue;
    }
    try {
      const out = await fn(m);
      if (out != null) { if (S.ai.lastUsed !== m) { S.ai.lastUsed = m; saveAI(); } return out; }
      errs.push({ code: 'invalid_json', model: m });
    } catch (e) {
      if ((signal && signal.aborted) || (e && e.code === 'cancelled')) throw { code: 'cancelled' };
      const err = e && e.code ? e : { code: 'http', msg: String((e && e.message) || e) };
      err.model = m;
      errs.push(err);
      if (err.code === 'not_found') S.skip.set(m, Infinity);

    for (let a = 0; a < 2; a++) {

}

async function commitResult(sh) {
  const r = sh.ctx;
  if (r.saving || !r.items.length) return;
  r.saving = true;
  paint(sh);
  const entry = cleanEntry({ id: r.id, day: r.day, ts: Date.now(), type: r.type, items: r.items, notes: r.notes, hasPhoto: !!r.thumb, source: r.source });
  try {
    await saveEntry(entry, r.thumb);
    closeSheet(sh);
    toast(typeOf(r.type).added);
  } catch (e) {
    r.saving = false;
    if (!r.closed) paint(sh);
    toast(dbErrText(e));
  }
}
async function onPhoto(ev) {
  const input = ev.target;
  const file = input.files && input.files[0];
  const preset = S.pending || {};
  S.pending = null;
  input.value = '';
  if (!file) return;
  if (file.type && !/^image\//.test(file.type)) { toast('Lütfen bir fotoğraf seç.'); return; }
  let blob, thumb;
  try {
    const img = await loadImage(file);
    blob = await toBlob(scaleCanvas(img, 1024), 0.8);
    thumb = scaleCanvas(img, 360).toDataURL('image/jpeg', 0.72);
  } catch (e) { toast('Bu fotoğraf açılamadı. Başka bir fotoğraf dene.'); return; }
  const sh = openResult(newSession({ source: 'photo', blob, thumb, preview: URL.createObjectURL(blob), day: preset.day, type: preset.type }));
  runAnalysis(sh);
}

/* ---------------- history ---------------- */
function dayMap() {
  const m = new Map();
  for (const e of S.entries.values()) {
    const v = sumItems(e.items), cur = m.get(e.day) || zero();
    for (const k of NUT) cur[k] += v[k];
    m.set(e.day, cur);
  }
  return m;
}
function buildSeries(range, dm) {
  const t = todayKey(), out = [];
  const avgOf = days => { const lg = days.filter(k => dm.has(k)); return { value: lg.length ? lg.reduce((a, k) => a + dm.get(k).calories, 0) / lg.length : 0, logged: lg.length }; };
  if (range === 'day') {
    for (let i = 13; i >= 0; i--) {
      const k = addDays(t, -i), d = parseDay(k), v = dm.get(k);
      out.push({ label: String(d.getDate()), title: dayName(k), days: [k], value: v ? v.calories : 0, logged: v ? 1 : 0 });
    }
  } else if (range === 'week') {
    const mon = addDays(t, -((parseDay(t).getDay() + 6) % 7));
    for (let i = 11; i >= 0; i--) {
      const s = addDays(mon, -7 * i), days = [];
      for (let j = 0; j < 7; j++) { const k = addDays(s, j); if (k <= t) days.push(k); }
      const sd = parseDay(s), ed = parseDay(addDays(s, 6)), a = avgOf(days);
      out.push({ label: sd.getDate() + '.' + (sd.getMonth() + 1), title: sd.getDate() + ' ' + MO[sd.getMonth()] + ' – ' + ed.getDate() + ' ' + MO[ed.getMonth()] + ' haftası', days, value: a.value, logged: a.logged });
    }
  } else {
    const td = parseDay(t);
    for (let i = 5; i >= 0; i--) {
      const m = new Date(td.getFullYear(), td.getMonth() - i, 1), days = [], d = new Date(m);
      while (d.getMonth() === m.getMonth()) { const k = dayKey(d); if (k > t) break; days.push(k); d.setDate(d.getDate() + 1); }
      const a = avgOf(days);
      out.push({ label: MO[m.getMonth()], title: MO_LONG[m.getMonth()] + ' ' + m.getFullYear(), days, value: a.value, logged: a.logged });
    }
  }
  return out;
}
function barPath(x, y, w, h, r) {
  r = Math.min(r, w / 2, h);
  return 'M' + x + ',' + (y + h) + 'V' + (y + r) + 'Q' + x + ',' + y + ' ' + (x + r) + ',' + y + 'H' + (x + w - r) + 'Q' + (x + w) + ',' + y + ' ' + (x + w) + ',' + (y + r) + 'V' + (y + h) + 'Z';
}
function chartSVG(ser, goal, sel) {
  const W = 360, H = 210, L = 38, R = 6, T = 14, B = 24, pw = W - L - R, ph = H - T - B;
  const maxV = Math.max(goal, ...ser.map(s => s.value));
  let step = 500, top = Math.max(1000, Math.ceil(maxV * 1.12 / step) * step);
  if (top > 3000) { step = 1000; top = Math.ceil(maxV * 1.12 / step) * step; }
  const y = v => T + ph * (1 - v / top);
  const n = ser.length, band = pw / n, bw = Math.min(30, band * 0.62);
  let g = '';
  for (let v = 0; v <= top + 0.1; v += step) g += '<line x1="' + L + '" x2="' + (W - R) + '" y1="' + y(v).toFixed(1) + '" y2="' + y(v).toFixed(1) + '" class="grid"/><text x="' + (L - 7) + '" y="' + (y(v) + 3.5).toFixed(1) + '" class="ax" text-anchor="end">' + fk(v) + '</text>';
  ser.forEach((s, i) => {
    const x0 = L + band * i, cx = x0 + band / 2;
    const hgt = s.logged ? Math.max(3, ph * s.value / top) : 0;
    const cls = 'bar' + (s.value > goal * 1.05 ? ' over' : '') + (i === sel ? ' sel' : '');
    g += '<g class="' + cls + '" data-act="hist-sel" data-i="' + i + '" role="button" aria-label="' + esc(s.title) + '"><rect x="' + x0.toFixed(1) + '" y="' + T + '" width="' + band.toFixed(1) + '" height="' + (ph + B) + '" fill="transparent"/>' +
      (s.logged ? '<path class="b" d="' + barPath(+(cx - bw / 2).toFixed(1), +(T + ph - hgt).toFixed(1), +bw.toFixed(1), +hgt.toFixed(1), 6) + '" style="animation-delay:' + i * 22 + 'ms"/>'
        : '<rect class="b0" x="' + (cx - bw / 2).toFixed(1) + '" y="' + (T + ph - 2) + '" width="' + bw.toFixed(1) + '" height="2" rx="1"/>') +
      '<text x="' + cx.toFixed(1) + '" y="' + (H - 6) + '" class="ax' + (i === sel ? ' on' : '') + '" text-anchor="middle">' + esc(s.label) + '</text></g>';
  });
  const gy = y(goal).toFixed(1);
  g += '<line class="goal" x1="' + L + '" x2="' + (W - R) + '" y1="' + gy + '" y2="' + gy + '"/><text class="ax goal-t" x="' + (W - R) + '" y="' + (gy - 5) + '" text-anchor="end">Hedef ' + fk(goal) + '</text>';
  return '<svg viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="Kalori grafiği">' + g + '</svg>';
}
function renderHistory() {

    '<div class="chart' + (S.histAnim ? ' anim' : '') + '">' + chartSVG(ser, G.kcal, sel) + '</div>';
  S.histAnim = false;
  const pk = agg.protein_g * 4, ck = agg.carbs_g * 4, fk9 = agg.fat_g * 9, sum = pk + ck + fk9;
  h += '<section><div class="sec-head"><h2>Makro dağılımı</h2><span class="fine">kalorideki payı</span></div>';

    h += '<div class="dist" role="img" aria-label="Protein yüzde ' + Math.round(pk / sum * 100) + ', karbonhidrat yüzde ' + Math.round(ck / sum * 100) + ', yağ yüzde ' + Math.round(fk9 / sum * 100) + '">' +
      [[pk, MAC[0].c], [ck, MAC[1].c], [fk9, MAC[2].c]].map(o => '<i style="flex:' + o[0].toFixed(1) + ' 1 0;background:' + o[1] + '"></i>').join('') + '</div>' +
      '<ul class="dist-leg">' + [[MAC[0], pk], [MAC[1], ck], [MAC[2], fk9]].map(o => '<li><span class="dot" style="background:' + o[0].c + '"></span><span>' + o[0].label + '</span><b class="num">%' + Math.round(o[1] / sum * 100) + '</b><span class="g num">' + fg(agg[o[0].k] / nd) + ' g/gün</span></li>').join('') + '</ul>' +
      '<p class="dist-minor num">Lif ' + fg(agg.fiber_g / nd) + ' g/gün · Şeker ' + fg(agg.sugar_g / nd) + ' g/gün</p>';
  } else h += '<p class="muted">Bu aralıkta kayıt yok. Öğün ekledikçe dağılım burada görünür.</p>';
  h += '</section>';

/* ---------------- backup ---------------- */
function downloadBlob(blob, name) {
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = name; a.rel = 'noopener';
  document.body.appendChild(a);
  a.click();
  setTimeout(() => { URL.revokeObjectURL(url); a.remove(); }, 4000);
}
async function buildBackup() {
  const entries = Array.from(S.entries.values()).map(e => clone(e)).sort((a, b) => a.ts - b.ts);
  const out = { app: 'lokma', version: 1, exportedAt: new Date().toISOString(), settings: S.settings, entries };
  if (S.bkPhotos) {
    const photos = {};
    for (const e of entries) if (e.hasPhoto) { const p = await getPhoto(e.id); if (p) photos[e.id] = p; }
    out.photos = photos;
  }
  const json = JSON.stringify(out);
  const name = 'lokma-yedek-' + todayKey() + '.json';
  return { name, blob: new Blob([json], { type: 'application/json' }), size: json.length };
}
async function saveBackupFile(b) {
  // iOS saves files through the share sheet ("Dosyalara Kaydet"); elsewhere a normal download works.
  if (isIOS() && navigator.canShare && window.File) {
    const file = new File([b.blob], b.name, { type: 'application/json' });
    if (navigator.canShare({ files: [file] })) {
      try { await navigator.share({ files: [file] }); S.bk = { mode: 'done', text: 'Yedek paylaşıldı. “Dosyalara Kaydet” ile sakladıysan hazırsın.' }; refreshBackupPanel(); return; }
      catch (e) { if (e && e.name === 'AbortError') return; }
    }
  }
  downloadBlob(b.blob, b.name);
  S.bk = { mode: 'done', text: b.name + ' indirildi.' };
  refreshBackupPanel();
}
async function exportBackup() {
  if (!S.entries.size) { toast('Yedeklenecek kayıt yok.'); return; }
  S.bk = { mode: 'busy', text: 'Yedek hazırlanıyor…' };
  refreshBackupPanel();
  let b;
  try { b = await buildBackup(); } catch (e) { S.bk = { mode: 'error', err: 'Yedek hazırlanamadı.' }; refreshBackupPanel(); return; }
  if (isIOS()) { S.bk = Object.assign({ mode: 'ready' }, b); refreshBackupPanel(); return; }
  saveBackupFile(b);
}
async function onBackupFile(ev) {
  const f = ev.target.files && ev.target.files[0];
  ev.target.value = '';
  if (!f) return;
  let data;
  try { data = JSON.parse(await f.text()); }
  catch (e) { S.bk = { mode: 'error', err: 'Dosya okunamadı. Lokma yedeği olan bir .json dosyası seç.' }; refreshBackupPanel(); return; }
  const entries = data && Array.isArray(data.entries) ? data.entries.map(cleanEntry).filter(Boolean) : null;
  if (!entries) { S.bk = { mode: 'error', err: 'Bu dosyada Lokma kaydı bulunamadı.' }; refreshBackupPanel(); return; }
  const ids = new Set(entries.map(e => e.id));
  const photos = {};
  if (data.photos && typeof data.photos === 'object') {
    for (const id of Object.keys(data.photos)) {
      const v = data.photos[id];
      if (ids.has(id) && typeof v === 'string' && v.indexOf('data:image/') === 0 && v.length < 3000000) photos[id] = v;
    }
  }
  S.bk = { mode: 'confirm', data: { entries, settings: data.settings || null, photos }, count: entries.length, photos: Object.keys(photos).length };
  refreshBackupPanel();
}
async function runImport() {
  const d = S.bk && S.bk.data;
  if (!d) return;
  S.bk = { mode: 'busy', text: d.entries.length + ' kayıt yükleniyor…' };
  refreshBackupPanel();
  try {
    if (d.settings) { S.settings = mergeSettings(d.settings); await saveSettings(true); }
    let photoFail = false;
    try { await Store.putPhotos(d.photos); } catch (e) { photoFail = true; }
    for (const e of d.entries) {
      const had = S.entries.get(e.id);
      e.hasPhoto = (!photoFail && !!d.photos[e.id]) || !!(had && had.hasPhoto);
    }
    await Store.putMeals(d.entries.map(clone));
    for (const e of d.entries) { S.entries.set(e.id, e); if (!photoFail && d.photos[e.id]) S.photos.set(e.id, d.photos[e.id]); }
    S.bk = { mode: 'done', text: d.entries.length + ' kayıt yüklendi.' + (photoFail ? ' Fotoğraflar depolama dolu olduğu için eklenemedi.' : '') };
    askPersist();
  } catch (e) {
    S.bk = { mode: 'error', err: dbErrText(fullErr(e)) };
  }
  renderSettings();
  requestRender();
}

  },
  'm-toggle': a => { const sh = sheetFor(a), key = a.dataset.e + ':' + a.dataset.i; sh.ctx.open = sh.ctx.open === key ? null : key; sh.ctx.confirm = null; paint(sh); },
  'm-delitem': a => { const sh = sheetFor(a), e = S.entries.get(a.dataset.e); if (!e) return; e.items.splice(Number(a.dataset.i), 1); sh.ctx.open = null; touchEntry(e.id); paint(sh); },
  'm-type': a => {
    const sh = sheetFor(a), e = S.entries.get(a.dataset.e), v = a.dataset.v;
    if (!e || e.type === v) return;
    e.type = v; touchEntry(e.id); paint(sh); toast(typeOf(v).moved);
  },
  'm-del': a => {
    const sh = sheetFor(a), id = a.dataset.e;
    if (sh.ctx.confirm !== id) {
      sh.ctx.confirm = id; paint(sh);
      setTimeout(() => { if (sh.ctx.confirm === id && stack.includes(sh)) { sh.ctx.confirm = null; paint(sh); } }, 4000);
      return;
    }
    sh.ctx.confirm = null;
    removeEntry(id);
  },
  'm-additem': a => { const sh = sheetFor(a), id = a.dataset.e; openItemForm(it => { const e = S.entries.get(id); if (!e) return; e.items.push(it); touchEntry(id); paint(sh); }); },
  'hist-range': a => { S.histRange = a.dataset.v; S.histSel = null; S.histAnim = true; renderHistory(); },
  'hist-sel': a => { S.histSel = Number(a.dataset.i); renderHistory(); },
  'hist-day': a => { S.viewDay = a.dataset.k; S.ringOff = null; switchTab('today'); },
  'prof': a => {
    const k = a.dataset.k, v = a.dataset.v;
    S.settings.profile[k] = v; saveSettings();
    for (const b of $$('[data-act="prof"][data-k="' + k + '"]')) b.setAttribute('aria-pressed', String(b.dataset.v === v));
    if (k === 'activity') $('#s-act-d').textContent = ACT[v].d;
    $('#s-rec').innerHTML = recHTML();
  },
  'rec-apply': () => {
    const r = recommend(S.settings.profile);
    if (!r) return;
    Object.assign(S.settings.goal, { kcal: r.kcal, protein: r.protein, carbs: r.carbs, fat: r.fat, fiber: r.fiber, sugar: r.sugar });
    saveSettings(true); renderSettings(); toast('Günlük hedefler güncellendi');
  },
  'key-eye': a => {
    const inp = $('#' + a.dataset.for);
    if (!inp) return;
    const show = inp.type === 'password';
    inp.type = show ? 'text' : 'password';
    a.setAttribute('aria-label', show ? 'Anahtarı gizle' : 'Anahtarı göster');
  },
  'key-save': () => {
    const k = cleanKey(($('#s-key') || {}).value);
    if (k && k.length < 20) { toast('Anahtar eksik görünüyor. Tamamını yapıştır.'); return; }
    saveKey(k);
  },
  'key-del': () => saveKey(''),
  'ai-test': () => testAI(),
  'ai-model': a => { S.ai.model = a.dataset.v; S.skip.clear(); S.aiTest = null; saveAI(); renderSettings(); },
  'install': async () => {
    const ev = S.installEvt;
    if (!ev) return;
    S.installEvt = null;
    try { ev.prompt(); await ev.userChoice; } catch (e) { /* ignore */ }
    if (S.tab === 'settings') renderSettings();
  },
  'wipe': async () => {
    if (!S.wipe) {
      S.wipe = true; renderSettings();
      setTimeout(() => { if (S.wipe) { S.wipe = false; if (S.tab === 'settings') renderSettings(); } }, 6000);
      return;
    }
    S.wipe = false;
    for (const t of S.dirty.values()) clearTimeout(t);
    S.dirty.clear();
    try { await Store.clearMeals(); S.entries.clear(); S.photos.clear(); toast('Tüm kayıtlar silindi'); }
    catch (e) { toast(dbErrText(fullErr(e))); }
    renderSettings();
  },
  'bk-down': () => exportBackup(),
  'bk-save': () => { if (S.bk && S.bk.mode === 'ready') saveBackupFile(S.bk); },
  'bk-up': () => $('#in-backup').click(),
  'bk-cancel': () => { S.bk = null; refreshBackupPanel(); },
  'bk-import': () => runImport(),
  'toast-act': () => { const fn = toastFn; toastFn = null; $('#toast').classList.remove('show'); if (fn) fn(); }
};

/* ---------------- init ---------------- */
$('#bottom').innerHTML =
  '<div class="dock" id="dock">' +
  '<label for="in-cam" class="cam" tabindex="0" ' + presetAttrs() + '>' + ic('camera') + '<span>Fotoğraf Çek</span></label>' +
  '<label for="in-gal" class="gal" tabindex="0" ' + presetAttrs() + ' aria-label="Galeriden seç">' + ic('image') + '<span>Galeri</span></label></div>' +
  '<nav class="tabs" aria-label="Bölümler">' +
  '<button class="tab" data-act="tab" data-tab="today" aria-current="page">' + ic('plate') + '<span>Bugün</span></button>' +
  '<button class="tab" data-act="tab" data-tab="history" aria-current="false">' + ic('bars') + '<span>Geçmiş</span></button>' +
  '<button class="tab" data-act="tab" data-tab="settings" aria-current="false">' + ic('sliders') + '<span>Ayarlar</span></button></nav>';

document.addEventListener('click', e => {
  const p = e.target.closest('[data-preset]');
  if (p) S.pending = { type: p.dataset.ptype || undefined, day: p.dataset.pday || undefined };
  const a = e.target.closest('[data-act]');
  if (!a || a.disabled) return;
  const fn = A[a.dataset.act];
  if (fn) fn(a, e);
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && stack.length) { closeSheet(); return; }
  const l = e.target.closest && e.target.closest('label[for][tabindex]');
  if (l && (e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); l.click(); }
});
$('#in-cam').addEventListener('change', onPhoto);
$('#in-gal').addEventListener('change', onPhoto);
$('#in-backup').addEventListener('change', onBackupFile);
$('#v-settings').addEventListener('input', onSettingsInput);
$('#v-settings').addEventListener('change', onSettingsInput);
window.addEventListener('online', updateOnline);
window.addEventListener('offline', updateOnline);
document.addEventListener('visibilitychange', () => { if (!document.hidden) requestRender(); });
window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); S.installEvt = e; if (S.tab === 'settings') { const el = $('#s-inst'); if (el) el.innerHTML = installHTML(); } });
window.addEventListener('appinstalled', () => { S.installEvt = null; toast('Lokma yüklendi'); });
document.body.classList.add('tab-today');
updateOnline();
boot();

if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) {
  window.addEventListener('load', () => { navigator.serviceWorker.register('sw.js').catch(() => {}); });
}
})();
</script>
</body>
